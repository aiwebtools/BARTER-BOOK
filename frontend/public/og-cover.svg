<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf7ef"/>
      <stop offset="100%" stop-color="#e8dcc3"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2f5f3d" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Logo -->
  <g transform="translate(80,80)">
    <rect width="72" height="72" rx="16" fill="#2f5f3d"/>
    <text x="36" y="52" font-family="Outfit, sans-serif" font-weight="800" font-size="46" fill="#f5efd8" text-anchor="middle">B</text>
  </g>
  <text x="170" y="132" font-family="Outfit, sans-serif" font-weight="700" font-size="36" fill="#1c1f1a">BarterGrid</text>

  <!-- Headline -->
  <text x="80" y="290" font-family="Outfit, sans-serif" font-weight="800" font-size="88" fill="#1c1f1a">Trade what you have</text>
  <text x="80" y="380" font-family="Outfit, sans-serif" font-weight="800" font-size="88" fill="#1c1f1a">for what you <tspan fill="#2f5f3d">need.</tspan></text>
  <text x="80" y="440" font-family="Inter, sans-serif" font-weight="500" font-size="28" fill="#4a4f45">Local exchange. Real people. No price tags required.</text>

  <!-- Connected nodes -->
  <g transform="translate(760,120)">
    <rect width="340" height="410" rx="24" fill="#ffffff" stroke="#e8dcc3" stroke-width="2"/>

    <!-- HAVE -->
    <rect x="24" y="40" width="200" height="90" rx="16" fill="#f2e6cc"/>
    <text x="42" y="72" font-family="Outfit, sans-serif" font-weight="700" font-size="14" fill="#2f5f3d" letter-spacing="2">HAVE</text>
    <text x="42" y="108" font-family="Outfit, sans-serif" font-weight="600" font-size="22" fill="#1c1f1a">Water Filter</text>

    <!-- Arrow -->
    <g transform="translate(150,160)">
      <circle r="26" fill="#2f5f3d"/>
      <path d="M-8 -3 L 8 -3 M 5 -6 L 8 -3 L 5 0 M 8 3 L -8 3 M -5 6 L -8 3 L -5 0" stroke="#f5efd8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- NEED -->
    <rect x="116" y="220" width="200" height="90" rx="16" fill="#d17849"/>
    <text x="134" y="252" font-family="Outfit, sans-serif" font-weight="700" font-size="14" fill="#ffffff" letter-spacing="2">NEED</text>
    <text x="134" y="288" font-family="Outfit, sans-serif" font-weight="600" font-size="22" fill="#ffffff">Bike Lock</text>

    <!-- Match label -->
    <text x="170" y="360" font-family="Outfit, sans-serif" font-weight="700" font-size="18" fill="#2f5f3d" text-anchor="middle" letter-spacing="3">MATCH</text>
  </g>
</svg>
